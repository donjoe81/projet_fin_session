






{% extends "base.html" %}

{% block title %}
    Profiling
{% endblock %}

{% block content %}

    <header>
        <style>
            body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #f4f6f9;
            }

            header {
                padding: 20px;
                background: #243b64;
                color: white;
            }

            main {
                padding: 20px;
            }

            iframe {
                width: 100%;
                height: 85vh;
                border: none;
                background: white;
                border-radius: 8px;
            }

            .error {
                padding: 15px;
                color: #842029;
                background: #f8d7da;
                border-radius: 5px;
            }
        </style>
        <h1>Rapport de profilage des données</h1>
    </header>

    <main>

        {% if erreur %}

            <div class="error">
                {{ erreur }}
            </div>

        {% else %}

            <iframe
                src="{{ url_for('main.afficher_rapport') }}"
                title="Rapport YData Profiling">
            </iframe>

        {% endif %}

    </main>

{% endblock %}
